<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy boyfriend’s day babes</title>
<style>
:root{--bg:#ffeef3;--ink:#5a2a3c;--soft:#8a5568;--pink:#ff7aa8;--butter:#ffe69a;--sky:#bfe3ff;--card:#fff;--shadow:rgba(120,40,70,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--ink:#ffe3ec;--soft:#e4aabd;--card:#3b2230;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#2a1620;--ink:#ffe3ec;--soft:#e4aabd;--card:#3b2230;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Times New Roman',Times,serif;line-height:1.5;
background-image:radial-gradient(circle at 12px 12px,rgba(255,122,168,.18) 3px,transparent 4px);background-size:44px 44px}
main{max-width:720px;margin:0 auto;padding:40px 20px 64px;text-align:center}
h1{font-family:'Times New Roman',Times,serif;font-weight:700;font-style:italic;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.15;margin:8px 0 12px;color:var(--pink);transform:rotate(-2deg)}
.sub{font-size:1.15rem;color:var(--soft);margin:0 auto 36px;max-width:30ch}
.heart{font-size:3rem;display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 20px;margin:20px 0 48px}
.polaroid{background:#fff;padding:12px 12px 14px;border-radius:6px;box-shadow:0 8px 20px var(--shadow);color:#5a2a3c}
.polaroid:nth-child(odd){transform:rotate(-3deg)}
.polaroid:nth-child(even){transform:rotate(2.5deg)}
.polaroid:nth-child(3n){transform:rotate(-1deg)}
.photo{aspect-ratio:1;border-radius:3px;display:grid;place-items:center;font-size:2.4rem;background:var(--butter)}
.polaroid:nth-child(2) .photo{background:var(--sky)}
.polaroid:nth-child(3) .photo{background:#ffd0e0}
.polaroid:nth-child(4) .photo{background:#d7f3d2}
.photo small{display:block;font-size:.8rem;color:#8a5568}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block}
.cap{font-family:'Times New Roman',Times,serif;font-size:1.05rem;margin-top:10px}
h2{font-family:'Times New Roman',Times,serif;font-weight:400;font-size:1.9rem;margin:0 0 16px}
button{font:inherit;font-weight:600;font-size:1.1rem;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 6px 0 #d9548a}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #d9548a}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.notes{list-style:none;padding:0;margin:28px auto 0;max-width:420px;display:grid;gap:12px}
.notes li{background:var(--card);border-radius:18px;padding:14px 18px;box-shadow:0 4px 12px var(--shadow);text-align:left;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
footer{margin-top:48px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

h1{background:linear-gradient(90deg,#ff4f93,#ffb347,#ff4f93,#b388ff,#ff4f93);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#ff4f93;animation:shine 5s linear infinite;filter:drop-shadow(0 2px 8px rgba(255,79,147,.45))}
@keyframes shine{to{background-position:-300% 0}}
.polaroid{position:relative;overflow:hidden;box-shadow:0 8px 24px var(--shadow),0 0 22px rgba(255,122,168,.45)}
.polaroid::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:glint 4.5s ease-in-out infinite}
.polaroid:nth-child(2)::after{animation-delay:1.5s}.polaroid:nth-child(3)::after{animation-delay:3s}
@keyframes glint{0%,60%{left:-80%}100%{left:140%}}
button{background:linear-gradient(135deg,#ff4f93,#ff8cc0);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 0 #d9548a,0 0 0 rgba(255,79,147,0)}50%{box-shadow:0 6px 0 #d9548a,0 0 26px rgba(255,79,147,.8)}}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float span{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:.0}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
main{position:relative;z-index:1}
.spark{position:fixed;pointer-events:none;z-index:5;font-size:1.4rem;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(160deg);opacity:0}}
.sign{font-size:2rem;font-style:italic;font-weight:700;color:var(--pink);margin-top:56px;text-shadow:0 0 14px rgba(255,79,147,.5)}
@media (prefers-reduced-motion:reduce){.float,.spark{display:none}h1{animation:none}}
</style>
</head>

  <section>
    <h2>Why I love you</h2>
    <button id="more" type="button">Tap for a reason 💌</button>
    <ul class="notes" id="notes" aria-live="polite"></ul>

<script>
var reasons=["You make ordinary days feel special.","You're the first person I want to tell everything.","You make me laugh when I need it most.","Being with you feels like home.","You're my favorite person, always."];
var i=0,btn=document.getElementById('more'),list=document.getElementById('notes');
btn.addEventListener('click',function(){
  var li=document.createElement('li');li.textContent='💗 '+reasons[i];list.appendChild(li);i++;
  if(i>=reasons.length){btn.textContent='I love you! 💖';btn.disabled=true;btn.style.opacity=.8}
});

var fl=document.getElementById('float'),ic=['💖','✨','💗','⭐','💕'];
for(var k=0;k<16;k++){var s=document.createElement('span');s.textContent=ic[k%5];s.style.left=(Math.random()*96)+'%';s.style.fontSize=(14+Math.random()*18)+'px';s.style.animationDuration=(9+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';fl.appendChild(s)}
btn.addEventListener('click',function(){
  var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(var n=0;n<14;n++){var p=document.createElement('span');p.className='spark';p.textContent=ic[n%5];p.style.left=cx+'px';p.style.top=cy+'px';
  var a=Math.random()*6.28,d=60+Math.random()*90;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(p);setTimeout(function(q){q.remove()},900,p)}
});
</script>
